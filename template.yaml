# Metadatos de la plantilla para el catálogo de NoExpertise.
id: gimnasio-deporte
nombre: Gimnasio y deporte
descripcion: Web enérgica en tema oscuro para gimnasios y centros deportivos, con clases, horario y tarifas.
sectores: [gimnasio, deporte, yoga, crossfit, club-deportivo, pilates]
secciones:
  - { id: hero, nombre: Portada }
  - { id: clases, nombre: Clases }
  - { id: horario-clases, nombre: Horario de clases }
  - { id: tarifas, nombre: Tarifas }
  - { id: entrenadores, nombre: Entrenadores }
  - { id: instalaciones, nombre: Instalaciones }
  - { id: opiniones, nombre: Opiniones }
  - { id: contacto, nombre: Contacto }
estilo: energico
plan_minimo: presencia
version: 1.1.0
base: astrowind
demo_url: https://demo-plantilla-gimnasio-deporte.noexpertise.com
activa: true
orden: 130

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu centro"
    pregunta: "¿Cómo se llama tu gimnasio o club y qué se puede hacer allí?"
    ayuda: "Sala, clases, yoga, pilates… y para quién."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.items, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: clases
    titulo: "Tus clases"
    pregunta: "¿Qué clases tenéis? Una por línea, con la intensidad si quieres (suave, media o alta)."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.clases.items]
  - id: horario
    titulo: "Horario de clases"
    pregunta: "Cuéntame el horario: día, hora, clase y quién la da. Una por línea."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.horario-clases.clases_horario]
  - id: tarifas
    titulo: "Tarifas"
    pregunta: "¿Qué cuotas o bonos tenéis? Nombre, precio y qué incluye. Uno por línea."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.tarifas.planes]
  - id: entrenadores
    titulo: "Entrenadores"
    pregunta: "¿Quién entrena? Nombre y especialidad de cada uno, uno por línea."
    ayuda: "Las fotos las pones luego en Contenido."
    tipo: lista
    campos: [secciones.entrenadores.personas]
  - id: instalaciones
    titulo: "Instalaciones"
    pregunta: "¿Cómo son vuestras instalaciones? Salas, vestuarios, aparcamiento…"
    tipo: texto
    campos: [secciones.instalaciones.titulo, secciones.instalaciones.texto, secciones.instalaciones.items]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.instalaciones.galeria]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
