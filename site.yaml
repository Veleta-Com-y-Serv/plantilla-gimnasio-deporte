    activa: true
    antetitulo: Clases dirigidas
    titulo: Elige cómo quieres sudar
    texto: "Grupos pequeños y un entrenador en cada clase. Para empezar desde cero o para ir a por más."
    items:
      - { titulo: Fuerza, texto: "Técnica de los básicos: sentadilla, peso muerto y press.", icono: pesa, imagen: /fotos/clase-fuerza.jpg, intensidad: Alta }
      - { titulo: Cross training, texto: "Circuitos cortos e intensos que cambian cada día.", icono: fuego, imagen: /fotos/clase-cross.jpg, intensidad: Alta }
      - { titulo: Ciclo indoor, texto: "45 minutos de bici con música. Tú marcas la resistencia.", icono: bici, imagen: /fotos/clase-ciclo.jpg, intensidad: Media }
      - { titulo: Boxeo, texto: "Golpeo, desplazamientos y mucho cardio. Sin contacto.", icono: guante, imagen: /fotos/clase-boxeo.jpg, intensidad: Media }
      - { titulo: Pilates, texto: "Core, postura y espalda sana. Con esterilla y accesorios.", icono: pulso, imagen: /fotos/clase-pilates.jpg, intensidad: Suave }
      - { titulo: Yoga, texto: "Movilidad, respiración y calma al acabar el día.", icono: loto, imagen: /fotos/clase-yoga.jpg, intensidad: Suave }

