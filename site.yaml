# Contenido de la web. Es lo único que rellena la plataforma NoExpertise.
# Una sola página: el menú apunta a anclas (#id-de-sección).
# Las secciones se muestran en el orden de este fichero. Para ocultar una: activa: false.
# Apartado nuevo: un id propio (es su ancla, /#id) con `tipo:` = el diseño de otra sección o `texto`.
# Listas planas: nunca una lista dentro de un elemento de lista. Precios siempre entre comillas.
nombre: Forja Training Club
eslogan: Gimnasio y clases dirigidas en Ponferrada. Entrena fuerte, sin permanencia.
sector: gimnasio
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = inicial + nombre en texto.
colores:
  primario: "#1c1d24"   # banda del horario
  acento: "#c6ff1a"     # verde neón: botones, franjas, resaltados
  fondo: "#0c0c0f"      # tema oscuro por defecto; con fondo claro el diseño también funciona
  texto: "#f2f2f0"
contacto:
  telefono: "987 40 63 18"
  email: hola@forjatraining.es
  direccion: Calle Río Boeza 9, 24403 Ponferrada (León)
  horario: "Lunes a viernes, de 6:00 a 23:00. Fines de semana, de 9:00 a 14:00."
  whatsapp: "+34 655 32 08 71"
redes:
  instagram: https://www.instagram.com/
  facebook: ""
  linkedin: ""
menu:
  - { texto: Clases, url: "/#clases" }
  - { texto: Horario, url: "/#horario-clases" }
  - { texto: Tarifas, url: "/#tarifas" }
  - { texto: Equipo, url: "/#entrenadores" }
  - { texto: Contacto, url: "/#contacto" }
boton_cabecera: { texto: Prueba gratis, url: "/#contacto" }
seo:
  titulo: Forja Training Club · Gimnasio y clases dirigidas en Ponferrada
  descripcion: "Sala de fuerza, cross training, ciclo indoor, yoga, pilates y boxeo en Ponferrada. Abierto de 6:00 a 23:00, sin permanencia y con clase de prueba gratis."
  tipo: ExerciseGym
marca_pie: true

secciones:
  hero:
    activa: true
    antetitulo: Gimnasio en Ponferrada
    titulo: Entrena sin excusas
    texto: "Sala de fuerza, clases dirigidas y entrenadores que te corrigen de verdad. Ven a probar una clase gratis."
    imagen: /fotos/hero.jpg
    cta: { texto: Reserva tu clase gratis, url: "/#contacto" }
